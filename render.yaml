services:
  - type: web
    name: rdvbi-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: rdvbi-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: rdvbi-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: rdvbi-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: SECURITY_JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: SECURITY_JWT_REFRESH_TTL_SECONDS
        value: 604800

databases:
  - name: rdvbi-db
    databaseName: rdvbi
    user: rdvbi
    plan: basic-256mb
